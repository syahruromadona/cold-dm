.filters{display:flex;gap:6px;margin-top:10px;overflow-x:auto}

ul{list-style:none;margin:0;padding:0 16px 90px}
li{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.ck{flex:none;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;display:grid;place-items:center;color:#fff;padding:0}
li.done .ck{background:var(--done);border-color:var(--done)}
.ck svg{width:22px;height:22px;opacity:0}
li.done .ck svg{opacity:1}
.txt{flex:1;min-width:0}
.nm{font-size:19px;line-height:1.3;word-break:break-word}
li.done .nm,li.skip .nm{color:var(--muted)}
li.done .nm{text-decoration:line-through}
.sub{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--accent);margin-top:4px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skipb{flex:none;background:none;border:0;color:var(--muted);font:400 16px Inter,sans-serif;text-decoration:underline;text-underline-offset:4px;padding:8px 2px}
li.skip .skipb{color:var(--accent)}
.sms{flex:none;width:52px;height:52px;border-radius:12px;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;text-decoration:none}
.sms svg{width:26px;height:26px}
.toast{position:fixed;left:16px;bottom:20px;background:var(--chip);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:13px "JetBrains Mono",monospace;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.toast b{width:8px;height:8px;border-radius:50%;background:var(--done)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>

const KEY='contacts-06112026';
let st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let filter='todo'; try{filter=localStorage.getItem(KEY+'-f')||'todo'}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
const bubble='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 4.9 3.4 6.5L4.6 21.4c-.1.4.3.7.7.5l3.7-1.9c.9.2 1.9.3 3 .3 5.5 0 10-3.9 10-8.6S17.5 3 12 3zM7.5 13a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4.5 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4.5 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6z"/></svg>';
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){} const t=document.getElementById('toast');t.classList.add('show');clearTimeout(save.t);save.t=setTimeout(()=>t.classList.remove('show'),1200)}
function render(){
  const done=C.filter((_,i)=>st[i]==='done').length, skip=C.filter((_,i)=>st[i]==='skip').length;
  document.getElementById('meta').textContent=`${done} done · ${skip} skipped · ${C.length-done-skip} left of ${C.length}`;
  document.getElementById('prog').style.width=((done+skip)/C.length*100)+'%';
  document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('on',b.dataset.f===filter));
  const rows=C.map((c,i)=>({c,i,s:st[i]||'todo'})).filter(r=>filter==='all'||r.s===filter);
  document.getElementById('list').innerHTML=rows.length?rows.map(({c,i,s})=>`
  <li class="${s}" data-i="${i}">
    <button class="ck" aria-label="Mark done">${check}</button>
    <div class="txt"><div class="nm">${esc(c.n)}</div><div class="sub">${esc(c.o)}</div></div>
    <button class="skipb">${s==='skip'?'Undo':'Skip'}</button>
    <a class="sms" href="sms:${c.t}" aria-label="Message ${esc(c.n)}">${bubble}</a>
  </li>`).join(''):'<div class="empty">Nothing here.</div>';
}
document.getElementById('list').addEventListener('click',e=>{
  const li=e.target.closest('li'); if(!li)return; const i=li.dataset.i;
  if(e.target.closest('.ck')){st[i]=st[i]==='done'?undefined:'done';save();render()}
  else if(e.target.closest('.skipb')){st[i]=st[i]==='skip'?undefined:'skip';save();render()}
});
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;try{localStorage.setItem(KEY+'-f',filter)}catch(e){}render()});
render();
